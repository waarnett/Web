<head>

  <meta name="theme-color" content="#2b2b2b">
  <title>Bill's</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icons/index-64.png">
  <link rel="apple-touch-icon" href="icons/index-apple-touch.png">

  <style>
    :root {
      --bg: #2b2b2b;
      --row-hover: #363636;
      --line: #3d3d3d;
      --text: #ececec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;   /* center the table on the page, both ways */
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    table {
      border-collapse: collapse;
    }

    tr + tr td {
      border-top: 1px solid var(--line);
    }

    tr:hover td {
      background: var(--row-hover);
    }

    td {
      padding: 0;
      vertical-align: middle;
    }

    td a {
      display: flex;
      align-items: center;
      min-height: 76px;
      color: inherit;
      text-decoration: none;
    }

    .icon a {
      padding: 0 18px 0 14px;
    }

    .name a {
      padding-right: 24px;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      font-weight: 600;
    }

    .name a:hover,
    .name a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .name a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: -2px;
    }

    /* each icon sits on a tile in its page's own background color */
    .tile {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      flex: none;
    }

    .tile svg {
      width: 42px;
      height: 42px;
    }

    .tile img {
      width: 44px;
      height: 44px;
    }
  </style>
</head>
