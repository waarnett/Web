<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>GNSS Position</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icons/gnss-64.png">
  <link rel="apple-touch-icon" href="icons/gnss-apple-touch.png">

  <style>
    :root {
      --bg: #05080f;
      --bg-glow: #0d2038;
      --panel: #0a1220;
      --panel-2: #0d1828;
      --border: #1a2a42;
      --accent: #00c8ff;
      --accent-soft: rgba(0, 200, 255, .14);
      --text: #e4edf7;
      --label: #7f97b3;
      --muted: #56708d;
      --green: #39d98a;
      --yellow: #f5c518;
      --red: #ff6b6b;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(900px 520px at 50% -160px, var(--bg-glow), transparent 70%),
        var(--bg);
      background-repeat: no-repeat;
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.4;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    main {
      max-width: 620px;
      margin: 0 auto;
    }

    /* ---------- header ---------- */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 2px 20px;
    }

    h1 {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(0, 200, 255, .45);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      font-size: .8rem;
      color: var(--label);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }

    .status[data-state="ok"] .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status[data-state="busy"] .dot {
      background: var(--yellow);
      animation: pulse 1s ease-in-out infinite;
    }

    .status[data-state="error"] .dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    @keyframes pulse {
      50% {
        opacity: .25;
      }
    }

    /* ---------- cards ---------- */

    .card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .hero {
      padding: 6px 20px;
      box-shadow: 0 0 0 1px rgba(0, 200, 255, .05), 0 18px 40px -24px rgba(0, 200, 255, .35);
    }

    .row {
      padding: 16px 0;
    }

    /* Latitude and longitude: the coordinate on the left, its two error lines stacked to the right
       and centered on it. The rows share one set of columns, so both error stacks start at the same
       place even when one coordinate is wider than the other. */
    .hero {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 14px;
    }

    .hero .row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      align-items: center;
    }

    .hero .label {
      grid-column: 1 / -1;
    }

    .errs .value.small {
      width: auto;
      min-height: 0;
      white-space: nowrap;
    }

    .row+.row {
      border-top: 1px solid var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .tile {
      padding: 14px 16px 16px;
      min-width: 0;
    }

    .label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--label);
    }

    .sub {
      margin-top: 2px;
      font-size: .78rem;
      color: var(--muted);
      min-height: 1.1em;
    }

    /* the clickable values */
    .value {
      display: block;
      width: calc(100% + 12px);
      margin: 2px -6px 0;
      padding: 2px 6px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s;
    }

    .value:hover {
      background: var(--accent-soft);
    }

    .value:active {
      color: var(--accent);
    }

    .value:focus-visible,
    .btn:focus-visible,
    .chip input:focus-visible+span,
    input[type="number"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .value.big {
      font-size: clamp(1.1rem, 5.4vw, 2.1rem);
    }

    .value.mid {
      font-size: clamp(1.1rem, 5vw, 1.5rem);
    }

    /* the ± error shown after a value, in a smaller, dimmer font */
    .value .err {
      font-size: .58em;
      font-weight: 500;
      color: var(--label);
    }

    /* the ± distance line under latitude and longitude */
    .value.small {
      font-size: .85rem;
      font-weight: 500;
      color: var(--label);
      min-height: 1.2em;
    }

    /* time of fix: if the time zone doesn't fit beside the time, it drops to a second line */
    #time {
      white-space: normal;
      font-size: clamp(.95rem, 4.1vw, 1.5rem);   /* a little smaller than the other cards so "12:48:32 PM PST" fits */
    }

    .value .nowrap,
    .value .err {
      white-space: nowrap;
    }

    .value.empty {
      color: var(--muted);
    }

    .value.flash {
      animation: flash .7s ease-out;
    }

    @keyframes flash {
      from {
        color: var(--accent);
        text-shadow: 0 0 14px rgba(0, 200, 255, .7);
      }
    }

    /* ---------- controls ---------- */

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: 600 .95rem var(--sans);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #03121c;
    }

    .btn.primary:hover {
      background: #4bd9ff;
    }

    .btn[disabled] {
      opacity: .6;
      cursor: progress;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex: none;
    }

    /* grayed out while tracking continuously */
    .btn.primary.tracking[disabled] {
      background: #2a3a50;
      border-color: #2a3a50;
      color: var(--label);
      opacity: 1;
    }

    .btn.spinning svg {
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn b {
      color: var(--accent);
      font-weight: 600;
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
    }

    .hint+.hint {
      margin-top: 4px;
    }

    .message {
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 107, 107, .4);
      border-radius: 12px;
      background: rgba(255, 107, 107, .08);
      color: #ffc9c9;
      font-size: .88rem;
    }

    .message[hidden] {
      display: none;
    }

    /* ---------- dialog ---------- */

    dialog {
      width: min(420px, calc(100vw - 32px));
      margin: auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-2);
      color: var(--text);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    }

    dialog::backdrop {
      background: rgba(2, 5, 10, .7);
      backdrop-filter: blur(3px);
    }

    dialog h2 {
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    dialog p {
      font-size: .85rem;
      color: var(--label);
      margin-bottom: 16px;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chip span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      font-size: .9rem;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .chip input:checked+span {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .custom {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: .9rem;
      color: var(--label);
    }

    .custom[hidden] {
      display: none;
    }

    input[type="number"] {
      width: 110px;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: 600 1rem var(--mono);
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 360px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>GNSS Position</h1>
      <div class="status" id="status" data-state="idle" role="status">
        <span class="dot"></span><span id="statusText">Waiting</span>
      </div>
    </header>

    <section class="card hero">
      <div class="row">
        <div class="label">Latitude</div>
        <button class="value big empty" id="lat" data-group="coord" title="Click to change format">—</button>
        <div class="errs">
          <button class="value small" id="latAng" data-group="coord" title="Click to change format"></button>
          <button class="value small" id="latErr" data-group="unit" title="Click to change units"></button>
        </div>
      </div>
      <div class="row">
        <div class="label">Longitude</div>
        <button class="value big empty" id="lon" data-group="coord" title="Click to change format">—</button>
        <div class="errs">
          <button class="value small" id="lonAng" data-group="coord" title="Click to change format"></button>
          <button class="value small" id="lonErr" data-group="unit" title="Click to change units"></button>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="card tile">
        <div class="label">Speed</div>
        <button class="value mid empty" id="speed" data-group="speed" title="Click to change units">—</button>
        <div class="sub" id="speedSub"></div>
      </div>
      <div class="card tile">
        <div class="label">Altitude</div>
        <button class="value mid empty" id="alt" data-group="unit" title="Click to change units">—</button>
        <div class="sub" id="altSub"></div>
      </div>
      <div class="card tile">
        <div class="label">Heading</div>
        <button class="value mid empty" id="heading" data-group="heading" title="Click to change format">—</button>
        <div class="sub" id="headingSub"></div>
      </div>
      <div class="card tile">
        <div class="label">Time of fix</div>
        <button class="value mid empty" id="time" data-group="time" title="Click to change format">—</button>
        <div class="sub" id="timeSub"></div>
      </div>
    </section>

    <div class="message" id="message" role="alert" hidden></div>

    <div class="controls">
      <button class="btn primary" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 4v7h-7" />
        </svg>
        Refresh
      </button>
      <button class="btn" id="autoBtn" aria-haspopup="dialog">Auto refresh: <b id="autoLabel">Off</b></button>
    </div>

    <p class="hint">Click any value to change its format or units.</p>
    <p class="hint" id="wakeNote" hidden></p>
  </main>

  <dialog id="autoDialog" aria-labelledby="autoTitle">
    <form method="dialog" id="autoForm">
      <h2 id="autoTitle">Auto refresh</h2>
      <p>How often should the position be re-read?</p>
      <div class="chips" id="chips"></div>
      <label class="custom" id="customRow" hidden>
        Every
        <input type="number" id="customSecs" min="1" max="86400" step="1" inputmode="numeric" value="15">
        seconds
      </label>
      <div class="dialog-actions">
        <button class="btn" type="button" id="autoCancel">Cancel</button>
        <button class="btn primary" type="submit">Set</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      'use strict';

      var FT_PER_M = 3.280839895;
      var COORD_MODES = ['dms', 'dec', 'dm'];        // deg-min-sec, decimal degrees, deg + decimal minutes
      var UNIT_MODES = ['m', 'ft'];
      var TIME_MODES = ['local', 'utc'];
      var SPEED_MODES = ['ms', 'kmh', 'mph', 'kn'];   // meters/second, km/hour, miles/hour, knots
      var HEADING_MODES = ['deg', 'compass'];
      var SPEED_UNITS = {
        ms: { factor: 1, label: 'm/s' },
        kmh: { factor: 3.6, label: 'km/h' },
        mph: { factor: 2.2369362921, label: 'mph' },
        kn: { factor: 1.9438444924, label: 'kn' }
      };
      var COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      var PRESETS = [0, 1, 2, 5, 10, 30, 60, 'custom']; // seconds; 0 = off

      var $ = function (id) { return document.getElementById(id); };

      // ---------- saved preferences ----------
      var prefs = { coord: 'dms', unit: 'm', time: 'local', speed: 'ms', heading: 'deg', auto: 0 };
      try {
        var saved = JSON.parse(localStorage.getItem('gpsPrefs') || '{}');
        if (COORD_MODES.indexOf(saved.coord) >= 0) prefs.coord = saved.coord;
        if (UNIT_MODES.indexOf(saved.unit) >= 0) prefs.unit = saved.unit;
        if (TIME_MODES.indexOf(saved.time) >= 0) prefs.time = saved.time;
        if (SPEED_MODES.indexOf(saved.speed) >= 0) prefs.speed = saved.speed;
        if (HEADING_MODES.indexOf(saved.heading) >= 0) prefs.heading = saved.heading;
        if (typeof saved.auto === 'number' && saved.auto >= 0 && saved.auto <= 86400) prefs.auto = Math.round(saved.auto);
      } catch (e) { /* storage unavailable: use defaults */ }

      function savePrefs() {
        try { localStorage.setItem('gpsPrefs', JSON.stringify(prefs)); } catch (e) { }
      }

      // ---------- formatting ----------
      function pad(n, width) {
        var s = String(n);
        while (s.length < width) s = '0' + s;
        return s;
      }

      function formatCoord(value, isLat) {
        var hemi = isLat ? (value < 0 ? 'S' : 'N') : (value < 0 ? 'W' : 'E');
        var abs = Math.abs(value);

        if (prefs.coord === 'dec') {
          return value.toFixed(6) + '°';
        }
        if (prefs.coord === 'dm') {
          // work in 1/10000 minute so rounding can never show 60.0000′
          var tenThousandths = Math.round(abs * 60 * 10000);
          var d = Math.floor(tenThousandths / 600000);
          var m = (tenThousandths - d * 600000) / 10000;
          return d + '° ' + pad(m.toFixed(4), 7) + '′ ' + hemi;
        }
        // work in 1/100 second so rounding can never show 60.00″
        var hundredths = Math.round(abs * 3600 * 100);
        var deg = Math.floor(hundredths / 360000);
        var rem = hundredths - deg * 360000;
        var min = Math.floor(rem / 6000);
        var sec = (rem - min * 6000) / 100;
        return deg + '° ' + pad(min, 2) + '′ ' + pad(sec.toFixed(2), 5) + '″ ' + hemi;
      }

      function formatLength(meters, signed) {
        if (prefs.unit === 'ft') {
          return Math.round(meters * FT_PER_M).toLocaleString() + ' ft';
        }
        var digits = Math.abs(meters) < 100 ? 1 : 0;
        return meters.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }) + ' m';
      }

      // number part of a length, in the chosen unit (same rounding as formatLength)
      function lengthNumber(meters) {
        if (prefs.unit === 'ft') return Math.round(meters * FT_PER_M).toLocaleString();
        var digits = Math.abs(meters) < 100 ? 1 : 0;
        return meters.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }

      function lengthUnit() {
        return prefs.unit === 'ft' ? 'ft' : 'm';
      }

      // ---------- position error as an angle ----------
      // The device reports horizontal error as a distance (a radius in meters). Turning that into
      // an angle needs the size of one degree at this latitude on the WGS 84 ellipsoid (the Earth
      // model GNSS uses): a degree of latitude is a little longer near the poles, and a degree of
      // longitude shrinks toward zero as the meridians converge at the poles.
      var WGS84_A = 6378137;                    // equatorial radius, meters
      var WGS84_F = 1 / 298.257223563;          // flattening
      var WGS84_E2 = WGS84_F * (2 - WGS84_F);   // eccentricity squared

      function metersPerDegree(latDeg, isLat) {
        var phi = latDeg * Math.PI / 180;
        var w = 1 - WGS84_E2 * Math.sin(phi) * Math.sin(phi);
        var perRadian = isLat
          ? WGS84_A * (1 - WGS84_E2) / Math.pow(w, 1.5)   // north-south radius of curvature
          : WGS84_A / Math.sqrt(w) * Math.cos(phi);       // radius of the circle of latitude
        return perRadian * Math.PI / 180;
      }

      // Error in the same angular unit as the coordinate format (seconds, minutes or degrees),
      // moving to a larger unit when the number would reach 60.
      var ANGLE_STEPS = {
        dms: [{ per: 3600, mark: '″', digits: 2 }, { per: 60, mark: '′', digits: 2 }, { per: 1, mark: '°', digits: 2 }],
        dm: [{ per: 60, mark: '′', digits: 4 }, { per: 1, mark: '°', digits: 2 }],
        dec: [{ per: 1, mark: '°', digits: 6 }]
      };

      function formatAngleError(meters, latDeg, isLat) {
        var degrees = meters / metersPerDegree(latDeg, isLat);
        if (!isFinite(degrees)) return null;   // longitude at a pole
        var steps = ANGLE_STEPS[prefs.coord];
        for (var i = 0; i < steps.length; i++) {
          var v = degrees * steps[i].per;
          if (v < 60 || i === steps.length - 1) return '±' + v.toFixed(steps[i].digits) + steps[i].mark;
        }
      }

      // value text followed by a smaller "±error" part
      function setWithError(id, main, err) {
        var el = $(id);
        el.textContent = '';
        var mainSpan = document.createElement('span');
        mainSpan.className = 'nowrap';
        mainSpan.textContent = main;
        el.appendChild(mainSpan);
        if (err) {
          var span = document.createElement('span');
          span.className = 'err';
          span.textContent = err;
          el.appendChild(document.createTextNode(' '));   // outside the spans, so the line can break here
          el.appendChild(span);
        }
        el.classList.remove('empty');
      }

      function formatSpeed(metersPerSecond) {
        var u = SPEED_UNITS[prefs.speed];
        return (metersPerSecond * u.factor).toFixed(1) + ' ' + u.label;
      }

      function headingDegrees(deg) {
        return (Math.round(deg) % 360) + '°';
      }

      function headingCompass(deg) {
        return COMPASS[Math.round(deg / 22.5) % 16];
      }

      function formatTime(ms) {
        var d = new Date(ms);
        if (prefs.time === 'utc') {
          return pad(d.getUTCHours(), 2) + ':' + pad(d.getUTCMinutes(), 2) + ':' + pad(d.getUTCSeconds(), 2);
        }
        return d.toLocaleTimeString();
      }

      // Short name of the time zone in force at that moment, e.g. "PST" or "PDT". Browsers give
      // letter codes mainly for zones the reader's language commonly abbreviates; elsewhere they
      // give an offset such as "GMT+1".
      function zoneName(ms) {
        if (prefs.time === 'utc') return 'UTC';
        try {
          var parts = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(new Date(ms));
          for (var i = 0; i < parts.length; i++) if (parts[i].type === 'timeZoneName') return parts[i].value;
        } catch (e) { }
        return '';
      }

      function formatDate(ms) {
        var d = new Date(ms);
        if (prefs.time === 'utc') {
          return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1, 2) + '-' + pad(d.getUTCDate(), 2);
        }
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function formatAge(ms) {
        var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
        if (s < 2) return 'just now';
        if (s < 60) return s + ' s ago';
        if (s < 3600) return Math.floor(s / 60) + ' min ago';
        return Math.floor(s / 3600) + ' h ago';
      }

      function formatInterval(secs) {
        if (!secs) return 'Off';
        if (secs % 3600 === 0) return (secs / 3600) + ' h';
        if (secs % 60 === 0) return (secs / 60) + ' min';
        return secs + ' s';
      }

      // ---------- rendering ----------
      var fix = null;   // last position reading

      function setValue(id, text, available) {
        var el = $(id);
        el.textContent = text;
        el.classList.toggle('empty', !available);
      }

      function render() {
        if (!fix) return;
        var hasAcc = typeof fix.accuracy === 'number' && isFinite(fix.accuracy) && fix.accuracy >= 0;
        var accText = hasAcc ? '±' + formatLength(fix.accuracy) : '';
        setValue('lat', formatCoord(fix.latitude, true), true);
        setValue('lon', formatCoord(fix.longitude, false), true);
        $('latAng').textContent = hasAcc ? formatAngleError(fix.accuracy, fix.latitude, true) || '' : '';
        $('lonAng').textContent = hasAcc ? formatAngleError(fix.accuracy, fix.latitude, false) || '' : '';
        $('latErr').textContent = accText;
        $('lonErr').textContent = accText;

        var hasAlt = typeof fix.altitude === 'number' && isFinite(fix.altitude);
        var hasVacc = typeof fix.altitudeAccuracy === 'number' && isFinite(fix.altitudeAccuracy) && fix.altitudeAccuracy >= 0;
        if (hasAlt) {
          setWithError('alt', lengthNumber(fix.altitude), hasVacc ? '±' + lengthNumber(fix.altitudeAccuracy) : null);
          // the unit goes after the error: "121 ±5.0 m"
          $('alt').appendChild(document.createTextNode(' ' + lengthUnit()));
        } else {
          setValue('alt', '—', false);
        }
        $('altSub').textContent = hasAlt ? (hasVacc ? '' : 'Error not reported') : 'Not reported by this device';

        // browsers report "no value" as null, NaN or a negative number depending on the device
        var hasSpeed = typeof fix.speed === 'number' && isFinite(fix.speed) && fix.speed >= 0;
        setValue('speed', hasSpeed ? formatSpeed(fix.speed) : '—', hasSpeed);
        $('speedSub').textContent = hasSpeed ? '' : 'Not reported by this device';

        var hasHeading = typeof fix.heading === 'number' && isFinite(fix.heading) && fix.heading >= 0;
        if (hasHeading) {
          var asCompass = prefs.heading === 'compass';
          setValue('heading', asCompass ? headingCompass(fix.heading) : headingDegrees(fix.heading), true);
          $('headingSub').textContent = (asCompass ? headingDegrees(fix.heading) : headingCompass(fix.heading)) + ' · from true north';
        } else {
          setValue('heading', '—', false);
          $('headingSub').textContent = 'Only reported while moving';
        }

        setWithError('time', formatTime(fix.timestamp), zoneName(fix.timestamp));   // zone in the smaller font
        renderAge();
      }

      function renderAge() {
        if (!fix) return;
        $('timeSub').textContent = formatDate(fix.timestamp) + ' · ' + formatAge(fix.timestamp);
      }

      function flash() {
        var values = document.querySelectorAll('.value');
        for (var i = 0; i < values.length; i++) {
          values[i].classList.remove('flash');
          void values[i].offsetWidth;   // restart the animation
          values[i].classList.add('flash');
        }
      }

      function setStatus(state, text) {
        $('status').dataset.state = state;
        $('statusText').textContent = text;
      }

      function showMessage(text) {
        $('message').textContent = text || '';
        $('message').hidden = !text;
      }

      // ---------- reading the position ----------
      // Two ways of reading:
      //  * tracking: for TRACK_SECS after the page opens or comes back into view, the browser streams
      //    readings continuously. Keeping the satellite receiver running lets it settle on a better
      //    position than a single reading taken from a cold start.
      //  * single reading: every Refresh press or auto refresh after that.
      var TRACK_SECS = 20;
      // enableHighAccuracy is the only precision setting the browser location interface offers;
      // true asks for the best available source (normally the satellite receiver) rather than
      // a quicker, coarser Wi-Fi or cell-tower estimate.
      var GEO_OPTIONS = {
        enableHighAccuracy: true,   // ask the device to prefer its satellite (GNSS) receiver
        maximumAge: 0,              // never accept a cached reading
        timeout: 20000
      };
      var pending = false;    // a single reading is in progress
      var tracking = false;   // continuous readings are in progress
      var watchId = null;
      var trackEnd = 0;
      var trackTimer = null;
      var trackGotFix = false;

      function canLocate() {
        if (!('geolocation' in navigator)) {
          setStatus('error', 'Unavailable');
          showMessage('This browser does not support location.');
          return false;
        }
        if (!window.isSecureContext) {
          setStatus('error', 'Unavailable');
          showMessage('Browsers only share location with secure pages. Open this page with an https:// address.');
          return false;
        }
        return true;
      }

      function setBusyButton(busy) {
        $('refresh').disabled = busy;
        $('refresh').classList.toggle('spinning', busy);
      }

      function refresh() {
        if (pending || tracking) return;
        if (!canLocate()) return;

        pending = true;
        setStatus('busy', 'Locating…');
        setBusyButton(true);
        navigator.geolocation.getCurrentPosition(onFix, onError, GEO_OPTIONS);
      }

      function done() {
        pending = false;
        if (!tracking) setBusyButton(false);
      }

      function trackStatus() {
        var left = Math.max(0, Math.ceil((trackEnd - Date.now()) / 1000));
        setStatus('busy', 'Tracking · ' + left + ' s');
      }

      function startTracking() {
        if (tracking || !canLocate()) return;
        tracking = true;
        trackGotFix = false;
        trackEnd = Date.now() + TRACK_SECS * 1000;
        setBusyButton(true);
        $('refresh').classList.add('tracking');
        trackStatus();
        watchId = navigator.geolocation.watchPosition(onTrackFix, onTrackError,
          { enableHighAccuracy: true, maximumAge: 0 });   // no per-reading time limit while tracking
        trackTimer = setInterval(function () {
          if (Date.now() >= trackEnd) stopTracking(true);
          else trackStatus();
        }, 250);
      }

      // finished: true when the full period ran; false when cut short (page hidden, permission denied)
      function stopTracking(finished) {
        if (!tracking) return;
        tracking = false;
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        clearInterval(trackTimer);
        trackTimer = null;
        $('refresh').classList.remove('tracking');
        if (!pending) setBusyButton(false);
        if (!finished) return;
        if (trackGotFix) setStatus('ok', 'Position found');
        else onError({ code: 3 });
      }

      function onTrackFix(pos) {
        trackGotFix = true;
        showFix(pos);
        trackStatus();
      }

      function onTrackError(err) {
        if (err.code === 1) {    // permission denied: no point continuing
          stopTracking(false);
          onError(err);
        } else if (!trackGotFix) {
          showError(err);        // keep listening; a later reading clears this message
          trackStatus();
        }
      }

      // Web pages count time in milliseconds from 1 Jan 1970. Safari on macOS has a long-standing bug
      // (WebKit bugs 24771 and 186689) where a reading's time is counted from Apple's own starting
      // date, 1 Jan 2001, so it appears exactly 31 years too early. Readings are requested fresh
      // (maximumAge 0), so a believable time is within an hour of the device clock.
      var APPLE_EPOCH_SHIFT = 978307200000;   // milliseconds from 1 Jan 1970 to 1 Jan 2001
      var PLAUSIBLE_MS = 3600 * 1000;

      function readingTime(ts) {
        var now = Date.now();
        if (typeof ts !== 'number' || !isFinite(ts)) return now;
        if (Math.abs(now - ts) <= PLAUSIBLE_MS) return ts;                                 // correct as reported
        if (Math.abs(now - (ts + APPLE_EPOCH_SHIFT)) <= PLAUSIBLE_MS) return ts + APPLE_EPOCH_SHIFT;  // Safari's 2001 count
        return now;   // wrong some other way: use the moment the reading arrived
      }

      function showFix(pos) {
        fix = {
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          altitude: pos.coords.altitude,
          altitudeAccuracy: pos.coords.altitudeAccuracy,
          speed: pos.coords.speed,
          heading: pos.coords.heading,
          timestamp: readingTime(pos.timestamp)
        };
        showMessage('');
        render();
        flash();
      }

      function onFix(pos) {
        done();
        showFix(pos);
        if (!tracking) setStatus('ok', 'Position found');
      }

      function onError(err) {
        done();
        if (!tracking) showError(err);
      }

      function showError(err) {
        var text;
        if (err.code === 1) {
          text = 'Location permission was denied. Allow location for this site in your browser settings, then press Refresh.';
          setStatus('error', 'Permission denied');
        } else if (err.code === 3) {
          text = 'The device took too long to find a position. Try again, ideally with a clear view of the sky.';
          setStatus('error', 'Timed out');
        } else {
          text = 'The device could not determine a position. Check that location services are turned on.';
          setStatus('error', 'No position');
        }
        showMessage(text);
      }

      // ---------- auto refresh ----------
      var timer = null;

      function applyAuto() {
        if (timer) { clearInterval(timer); timer = null; }
        if (prefs.auto > 0) timer = setInterval(refresh, prefs.auto * 1000);
        $('autoLabel').textContent = formatInterval(prefs.auto);
      }

      // build the interval choices
      var chips = $('chips');
      PRESETS.forEach(function (p) {
        var label = document.createElement('label');
        label.className = 'chip';
        var input = document.createElement('input');
        input.type = 'radio';
        input.name = 'interval';
        input.value = String(p);
        var span = document.createElement('span');
        span.textContent = p === 'custom' ? 'Custom' : formatInterval(p);
        label.appendChild(input);
        label.appendChild(span);
        chips.appendChild(label);
      });

      function selectedInterval() {
        var checked = chips.querySelector('input:checked');
        return checked ? checked.value : '0';
      }

      function syncCustomRow() {
        var custom = selectedInterval() === 'custom';
        $('customRow').hidden = !custom;
        $('customSecs').required = custom;
      }

      chips.addEventListener('change', function () {
        syncCustomRow();
        if (selectedInterval() === 'custom') $('customSecs').focus();
      });

      $('autoBtn').addEventListener('click', function () {
        var isPreset = PRESETS.indexOf(prefs.auto) >= 0;
        var want = isPreset ? String(prefs.auto) : 'custom';
        var inputs = chips.querySelectorAll('input');
        for (var i = 0; i < inputs.length; i++) inputs[i].checked = inputs[i].value === want;
        if (!isPreset) $('customSecs').value = prefs.auto;
        syncCustomRow();
        $('autoDialog').showModal();
      });

      $('autoCancel').addEventListener('click', function () { $('autoDialog').close(); });

      // clicking the dimmed area outside the box closes it
      $('autoDialog').addEventListener('click', function (e) {
        if (e.target === $('autoDialog')) $('autoDialog').close();
      });

      $('autoForm').addEventListener('submit', function () {
        var choice = selectedInterval();
        var secs = choice === 'custom' ? Math.round(Number($('customSecs').value)) : Number(choice);
        if (!isFinite(secs) || secs < 0) secs = 0;
        prefs.auto = Math.min(secs, 86400);
        savePrefs();
        applyAuto();
        if (prefs.auto > 0) refresh();
      });

      // ---------- clicking values switches format ----------
      var GROUPS = { coord: COORD_MODES, unit: UNIT_MODES, time: TIME_MODES, speed: SPEED_MODES, heading: HEADING_MODES };

      document.addEventListener('click', function (e) {
        var el = e.target.closest ? e.target.closest('.value') : null;
        if (!el) return;
        var group = el.dataset.group;
        var modes = GROUPS[group];
        prefs[group] = modes[(modes.indexOf(prefs[group]) + 1) % modes.length];
        savePrefs();
        render();
      });

      // ---------- keep the screen awake ----------
      // The Screen Wake Lock interface stops the device dimming and auto-locking while this page is
      // visible. The browser drops the lock whenever the page is hidden (tab switched, app sent to
      // the background), so it is requested again each time the page becomes visible.
      var wakeLock = null;
      var wakeSupported = 'wakeLock' in navigator;

      function setWakeNote(text) {
        $('wakeNote').textContent = text || '';
        $('wakeNote').hidden = !text;
      }

      function requestWakeLock() {
        if (!wakeSupported || wakeLock || document.hidden) return;
        navigator.wakeLock.request('screen').then(function (lock) {
          wakeLock = lock;
          setWakeNote('Screen will stay on while this page is open.');
          lock.addEventListener('release', function () {
            wakeLock = null;
            if (!document.hidden) setWakeNote('Screen may turn off: the device released the keep-awake lock.');
          });
        }).catch(function () {
          // some browsers refuse until the person has touched the page; a later tap retries
          setWakeNote('Screen may turn off: tap the page to keep it awake.');
        });
      }

      if (wakeSupported) {
        document.addEventListener('visibilitychange', requestWakeLock);
        document.addEventListener('click', requestWakeLock);
        document.addEventListener('touchend', requestWakeLock);
        requestWakeLock();
      } else {
        setWakeNote('This browser cannot stop the screen from turning off.');
      }

      // ---------- start ----------
      $('refresh').addEventListener('click', refresh);
      setInterval(renderAge, 1000);
      // Track continuously on opening and on every return to the page (the receiver has likely
      // gone idle while the page was in the background). Stop if the page is hidden mid-way.
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopTracking(false);
        else startTracking();
      });
      applyAuto();
      startTracking();
    })();
  </script>
</body>

</html>
